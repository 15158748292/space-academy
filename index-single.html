<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B0E27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="星际学园">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/15158748292/space-academy@main/icon.png">
    
    <title>星际学园 · 玩中学太空工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    
    
    
<style>

/* ===== css/main.css ===== */
/* ============================================
   星际学园 - 全局样式
   ============================================ */

:root {
    /* 色彩体系 */
    --color-deep-space: #0B0E27;
    --color-nebula-start: #1e2a5e;
    --color-nebula-end: #2d1b69;
    --color-rocket: #FF6B35;
    --color-star-yellow: #FFD93D;
    --color-success: #6BCB77;
    --color-error: #FF5959;
    --color-text-primary: #E8E8FF;
    --color-text-secondary: #A0A0C0;
    --color-card-bg: rgba(30, 42, 94, 0.6);
    --color-card-border: rgba(255, 217, 61, 0.2);

    /* 字体 */
    --font-title: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif;
    --font-body: 'Noto Sans SC', sans-serif;
    --font-number: 'Orbitron', monospace;

    /* 尺寸 */
    --statusbar-height: 64px;
    --breadcrumb-height: 44px;
    --max-width: 1200px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    font-size: 17px;
}

@media (max-width: 768px) {
    html { font-size: 16px; }
}

body {
    font-family: var(--font-body);
    background: linear-gradient(135deg, var(--color-deep-space) 0%, var(--color-nebula-start) 50%, var(--color-nebula-end) 100%);
    color: var(--color-text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
}

/* 星空Canvas */
#starfield {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
}

/* 主容器 */
.app-container {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 20px;
    padding-top: calc(var(--statusbar-height) + var(--breadcrumb-height) + 20px);
    min-height: 100vh;
}

.app-container.no-breadcrumb {
    padding-top: calc(var(--statusbar-height) + 20px);
}

/* 顶部状态栏 */
.statusbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--statusbar-height);
    background: rgba(11, 14, 39, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 217, 61, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
    transition: transform 0.3s ease;
}

.statusbar.hidden {
    display: none;
}

.statusbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.statusbar-avatar {
    font-size: 2rem;
    filter: drop-shadow(0 0 8px rgba(255, 217, 61, 0.4));
}

.statusbar-info {
    display: flex;
    flex-direction: column;
}

.statusbar-name {
    font-family: var(--font-title);
    font-size: 1.05rem;
    color: var(--color-star-yellow);
    line-height: 1.2;
}

.statusbar-level {
    font-size: 0.75rem;
    color: var(--color-text-secondary);
}

.statusbar-center {
    display: flex;
    align-items: center;
    gap: 8px;
}

.statusbar-score-label {
    font-size: 0.8rem;
    color: var(--color-text-secondary);
}

.statusbar-score {
    font-family: var(--font-number);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--color-star-yellow);
    text-shadow: 0 0 12px rgba(255, 217, 61, 0.5);
}

.statusbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* 面包屑 */
.breadcrumb {
    position: fixed;
    top: var(--statusbar-height);
    left: 0;
    right: 0;
    height: var(--breadcrumb-height);
    background: rgba(11, 14, 39, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 99;
    font-size: 0.85rem;
    color: var(--color-text-secondary);
    gap: 6px;
}

.breadcrumb.hidden {
    display: none;
}

.breadcrumb a {
    color: var(--color-text-secondary);
    text-decoration: none;
    transition: color 0.2s;
}

.breadcrumb a:hover {
    color: var(--color-star-yellow);
}

.breadcrumb-separator {
    opacity: 0.5;
}

/* 加载页 */
.loading {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--color-deep-space);
    z-index: 1000;
    transition: opacity 0.5s;
}

.loading.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-rocket {
    font-size: 5rem;
    animation: rocket-launch 1.5s ease-in-out infinite;
}

.loading p {
    margin-top: 20px;
    font-size: 1.2rem;
    color: var(--color-text-secondary);
}

/* 工具类 */
.hidden {
    display: none !important;
}

.text-center {
    text-align: center;
}

.fade-in {
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== css/theme.css ===== */
/* ============================================
   星际学园 - 太空主题样式
   ============================================ */

/* 星球入口 */
.planet-card {
    position: relative;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
}

.planet-card:hover {
    transform: scale(1.08);
}

.planet-card:active {
    transform: scale(0.95);
}

.planet-english {
    background: radial-gradient(circle at 30% 30%, #4FC3F7, #1976D2, #0D47A1);
    box-shadow: 0 0 40px rgba(79, 195, 247, 0.4), inset -20px -20px 40px rgba(0,0,0,0.3);
    animation: planet-float 6s ease-in-out infinite;
}

.planet-math {
    background: radial-gradient(circle at 30% 30%, #FFB74D, #F57C00, #E65100);
    box-shadow: 0 0 40px rgba(255, 183, 77, 0.4), inset -20px -20px 40px rgba(0,0,0,0.3);
    animation: planet-float 7s ease-in-out infinite 0.5s;
}

.planet-writing {
    background: radial-gradient(circle at 30% 30%, #BA68C8, #7B1FA2, #4A148C);
    box-shadow: 0 0 40px rgba(186, 104, 200, 0.4), inset -20px -20px 40px rgba(0,0,0,0.3);
    animation: planet-float 8s ease-in-out infinite 1s;
}

@keyframes planet-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.planet-icon {
    font-size: 4rem;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
}

.planet-label {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-title);
    font-size: 1.2rem;
    white-space: nowrap;
    color: var(--color-text-primary);
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

.planet-ring {
    position: absolute;
    width: 220%;
    height: 40px;
    border: 3px solid rgba(255, 217, 61, 0.3);
    border-radius: 50%;
    transform: rotate(-20deg);
    top: 50%;
    left: 50%;
    margin-top: -20px;
    margin-left: -110%;
    pointer-events: none;
}

/* 母舰首页 */
.home-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 0;
}

.home-title {
    font-family: var(--font-title);
    font-size: 2.5rem;
    color: var(--color-star-yellow);
    text-shadow: 0 0 20px rgba(255, 217, 61, 0.4);
    margin-bottom: 10px;
    text-align: center;
}

.home-subtitle {
    color: var(--color-text-secondary);
    margin-bottom: 50px;
    text-align: center;
    font-size: 1.1rem;
}

.planets-row {
    display: flex;
    justify-content: center;
    gap: 60px;
    flex-wrap: wrap;
    margin-bottom: 60px;
}

.planet-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
}

/* 启航舱（登录页） */
.login-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
}

.login-logo {
    font-size: 6rem;
    animation: rocket-launch 2s ease-in-out infinite;
}

.login-title {
    font-family: var(--font-title);
    font-size: 3rem;
    color: var(--color-star-yellow);
    text-shadow: 0 0 30px rgba(255, 217, 61, 0.5);
    margin: 20px 0 10px;
}

.login-desc {
    color: var(--color-text-secondary);
    margin-bottom: 40px;
    font-size: 1.15rem;
}

.login-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 400px;
}

.avatar-selector {
    display: flex;
    gap: 16px;
    justify-content: center;
}

.avatar-option {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--color-card-bg);
    border: 3px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    cursor: pointer;
    transition: all 0.2s;
}

.avatar-option.selected {
    border-color: var(--color-star-yellow);
    box-shadow: 0 0 20px rgba(255, 217, 61, 0.5);
    transform: scale(1.1);
}

/* 科目任务选择页 */
.subject-page {
    padding: 20px 0;
}

.subject-header {
    text-align: center;
    margin-bottom: 30px;
}

.subject-title {
    font-family: var(--font-title);
    font-size: 2rem;
    margin-bottom: 8px;
}

.subject-title.english { color: #4FC3F7; }
.subject-title.math { color: #FFB74D; }
.subject-title.writing { color: #BA68C8; }

.subject-desc {
    color: var(--color-text-secondary);
    font-size: 1rem;
}

.task-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
}

.task-card {
    background: var(--color-card-bg);
    border: 2px solid var(--color-card-border);
    border-radius: 16px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.task-card:hover {
    border-color: var(--color-star-yellow);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.task-card.locked {
    opacity: 0.5;
    cursor: not-allowed;
    filter: grayscale(0.5);
}

.task-card.locked:hover {
    border-color: var(--color-card-border);
    transform: none;
    box-shadow: none;
}

.task-card-icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
}

.task-card-title {
    font-family: var(--font-title);
    font-size: 1.3rem;
    margin-bottom: 8px;
    color: var(--color-star-yellow);
}

.task-card-desc {
    color: var(--color-text-secondary);
    font-size: 0.9rem;
    line-height: 1.5;
}

.task-card-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255, 217, 61, 0.15);
    border: 1px solid rgba(255, 217, 61, 0.3);
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 0.75rem;
    color: var(--color-star-yellow);
}

.task-card-lock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3rem;
    opacity: 0.7;
}

/* 勋章墙 */
.badge-wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 20px;
    max-width: 800px;
    margin: 30px auto;
}

.badge-item {
    background: var(--color-card-bg);
    border: 2px solid var(--color-card-border);
    border-radius: 16px;
    padding: 20px 12px;
    text-align: center;
    transition: all 0.3s ease;
}

.badge-item.earned {
    border-color: var(--color-star-yellow);
    box-shadow: 0 0 16px rgba(255, 217, 61, 0.2);
}

.badge-item.earned .badge-item-icon {
    filter: drop-shadow(0 0 10px rgba(255, 217, 61, 0.5));
}

.badge-item:not(.earned) {
    opacity: 0.5;
    filter: grayscale(1);
}

.badge-item-icon {
    font-size: 2.8rem;
    margin-bottom: 8px;
}

.badge-item-name {
    font-family: var(--font-title);
    font-size: 0.9rem;
    color: var(--color-text-primary);
    margin-bottom: 4px;
}

.badge-item-desc {
    font-size: 0.72rem;
    color: var(--color-text-secondary);
    line-height: 1.4;
}

/* 宇航员档案 */
.profile-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    max-width: 800px;
    margin: 20px auto;
}

.stat-card {
    background: var(--color-card-bg);
    border: 2px solid var(--color-card-border);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
}

.stat-value {
    font-family: var(--font-number);
    font-size: 2rem;
    color: var(--color-star-yellow);
    font-weight: 700;
}

.stat-label {
    color: var(--color-text-secondary);
    font-size: 0.9rem;
    margin-top: 4px;
}

@keyframes rocket-launch {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
}

/* ===== css/components.css ===== */
/* ============================================
   星际学园 - 组件样式
   ============================================ */

/* 按钮 */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    font-family: var(--font-body);
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    min-height: 48px;
}

.btn-primary {
    background: linear-gradient(135deg, var(--color-rocket), #FF8855);
    color: white;
    box-shadow: 0 4px 16px rgba(255, 107, 53, 0.4);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
}

.btn-primary:active {
    transform: translateY(0);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: var(--color-text-primary);
    border: 2px solid rgba(255, 255, 255, 0.2);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
}

.btn-large {
    padding: 16px 40px;
    font-size: 1.2rem;
}

.btn-icon {
    background: none;
    border: none;
    font-size: 1.8rem;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.2s;
    min-width: 48px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-icon:hover {
    background: rgba(255, 217, 61, 0.1);
    transform: scale(1.1);
}

/* 输入框 */
.input-field {
    width: 100%;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: var(--color-text-primary);
    font-family: var(--font-body);
    font-size: 1.1rem;
    outline: none;
    transition: border-color 0.2s;
}

.input-field::placeholder {
    color: var(--color-text-secondary);
}

.input-field:focus {
    border-color: var(--color-star-yellow);
    background: rgba(255, 255, 255, 0.1);
}

/* 卡片 */
.card {
    background: var(--color-card-bg);
    border: 2px solid var(--color-card-border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
}

/* 题目区 */
.question-area {
    background: rgba(11, 14, 39, 0.6);
    border: 2px solid var(--color-card-border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 20px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.question-story {
    font-size: 1rem;
    color: var(--color-text-secondary);
    line-height: 1.6;
    margin-bottom: 12px;
    font-style: italic;
}

.question-text {
    font-size: 1.25rem;
    line-height: 1.6;
    margin-bottom: 20px;
    color: var(--color-text-primary);
}

.question-number {
    display: inline-block;
    background: var(--color-rocket);
    color: white;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    line-height: 32px;
    text-align: center;
    font-weight: 700;
    font-size: 0.9rem;
    margin-right: 10px;
}

/* 选项按钮 */
.options {
    display: grid;
    gap: 12px;
}

.option-btn {
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: var(--color-text-primary);
    font-size: 1.1rem;
    font-family: var(--font-body);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
}

.option-btn:hover {
    background: rgba(255, 217, 61, 0.1);
    border-color: rgba(255, 217, 61, 0.3);
}

.option-btn.selected {
    background: rgba(255, 107, 53, 0.15);
    border-color: var(--color-rocket);
}

.option-btn.correct {
    background: rgba(107, 203, 119, 0.2);
    border-color: var(--color-success);
    animation: pulse-success 0.5s ease;
}

.option-btn.wrong {
    background: rgba(255, 89, 89, 0.15);
    border-color: var(--color-error);
    animation: shake 0.4s ease;
}

.option-letter {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
}

/* 填空输入 */
.fill-input {
    display: inline-block;
    width: 120px;
    padding: 8px 16px;
    background: rgba(255, 217, 61, 0.1);
    border: 2px solid var(--color-star-yellow);
    border-radius: 10px;
    color: var(--color-text-primary);
    font-family: var(--font-number);
    font-size: 1.15rem;
    text-align: center;
    outline: none;
    margin: 0 6px;
}

.fill-input.correct {
    border-color: var(--color-success);
    background: rgba(107, 203, 119, 0.15);
}

.fill-input.wrong {
    border-color: var(--color-error);
    background: rgba(255, 89, 89, 0.1);
    animation: shake 0.4s ease;
}

/* 反馈消息 */
.feedback {
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    margin: 16px 0;
    font-size: 1.1rem;
    font-weight: 500;
    animation: fadeIn 0.3s ease;
}

.feedback.success {
    background: rgba(107, 203, 119, 0.15);
    color: var(--color-success);
    border: 1px solid rgba(107, 203, 119, 0.3);
}

.feedback.error {
    background: rgba(255, 89, 89, 0.1);
    color: var(--color-error);
    border: 1px solid rgba(255, 89, 89, 0.2);
}

/* 进度条（燃料表） */
.fuel-gauge {
    width: 100%;
    height: 24px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    overflow: hidden;
    margin: 12px 0;
    position: relative;
    border: 2px solid rgba(255, 217, 61, 0.2);
}

.fuel-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--color-rocket), var(--color-star-yellow));
    border-radius: 10px;
    transition: width 0.5s ease;
    position: relative;
}

.fuel-bar::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

<script>

// ===== js/store.js =====
/**
 * Store - 存档管理系统
 * 负责localStorage的读写、数据校验、状态管理
 */

const STORE_KEY = 'spaceAcademy_save';
const STORE_VERSION = '1.0';

// 默认存档数据
function createDefaultSave() {
    return {
        version: STORE_VERSION,
        player: {
            name: '',
            avatar: '👨‍🚀',
            level: 1,
            totalScore: 0,
            createdAt: new Date().toISOString(),
            lastLogin: null,
            loginStreak: 0
        },
        progress: {
            english: {
                vocabulary: { completed: 0, correctTotal: 0, lastPlayed: null },
                sentence:   { completed: 0, correctTotal: 0, lastPlayed: null },
                listening:  { completed: 0, correctTotal: 0, lastPlayed: null },
                dialogue:   { completed: 0, correctTotal: 0, lastPlayed: null }
            },
            math: {
                fuelCalc:  { completed: 0, correctTotal: 0, lastPlayed: null },
                starRoute: { completed: 0, correctTotal: 0, lastPlayed: null },
                cipherEq:  { completed: 0, correctTotal: 0, lastPlayed: null },
                baseBuild: { completed: 0, correctTotal: 0, lastPlayed: null }
            },
            writing: {
                storyEngine:   { completed: 0, lastPlayed: null },
                wordBridge:    { completed: 0, lastPlayed: null },
                sceneHologram: { completed: 0, lastPlayed: null }
            }
        },
        badges: [],
        stories: [],  // 作文故事集
        unlockedFeatures: [],
        dailyTasks: {
            date: '',
            tasksDone: 0
        },
        settings: {
            soundEnabled: true,
            difficulty: 'auto'
        }
    };
}

const Store = {
    data: null,

    // 初始化/读取存档
    load() {
        try {
            const raw = localStorage.getItem(STORE_KEY);
            if (!raw) {
                this.data = createDefaultSave();
                return false; // 没有存档，需要创建角色
            }
            const parsed = JSON.parse(raw);
            // 简单校验
            if (!parsed.player || !parsed.progress) {
                this.data = createDefaultSave();
                return false;
            }
            this.data = parsed;
            return this.data.player.name !== ''; // 有存档且已创建角色
        } catch (e) {
            console.error('读取存档失败:', e);
            this.data = createDefaultSave();
            return false;
        }
    },

    // 保存
    save() {
        try {
            localStorage.setItem(STORE_KEY, JSON.stringify(this.data));
        } catch (e) {
            console.error('保存失败:', e);
        }
    },

    // 创建角色
    createPlayer(name, avatar) {
        this.data.player.name = name;
        this.data.player.avatar = avatar;
        this.checkDailyLogin();
        this.save();
    },

    // 每日登录检查
    checkDailyLogin() {
        const today = new Date().toISOString().slice(0, 10);
        const player = this.data.player;

        if (player.lastLogin !== today) {
            // 检查是否连续
            const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
            if (player.lastLogin === yesterday) {
                player.loginStreak = (player.loginStreak || 0) + 1;
            } else {
                player.loginStreak = 1;
            }
            player.lastLogin = today;

            // 每日登录奖励
            this.addScore(5, false);

            // 连续登录奖励
            if (player.loginStreak === 3) {
                this.addScore(15, false);
            } else if (player.loginStreak === 7) {
                this.addScore(30, false);
            }

            // 检查连续登录勋章
            if (player.loginStreak >= 3) {
                Scoring.unlockBadge('daily_cruiser');
            }
            if (player.loginStreak >= 7) {
                Scoring.unlockBadge('persistence_star');
            }

            this.save();
            return player.loginStreak;
        }
        return null;
    },

    // 添加积分
    addScore(amount, checkLevel = true) {
        this.data.player.totalScore += amount;
        if (checkLevel) {
            const leveledUp = Scoring.checkLevelUp();
            if (leveledUp) {
                return { leveledUp: true, newLevel: this.data.player.level };
            }
        }
        return { leveledUp: false };
    },

    // 记录完成
    recordCompletion(subject, type, correctCount, totalCount) {
        const subj = this.data.progress[subject];
        if (!subj || !subj[type]) return;

        subj[type].completed++;
        if (correctCount !== undefined) {
            subj[type].correctTotal += correctCount;
        }
        subj[type].lastPlayed = new Date().toISOString().slice(0, 10);

        // 每日任务计数
        const today = new Date().toISOString().slice(0, 10);
        if (this.data.dailyTasks.date !== today) {
            this.data.dailyTasks.date = today;
            this.data.dailyTasks.tasksDone = 0;
        }
        this.data.dailyTasks.tasksDone++;

        // 检查各类勋章
        Scoring.checkAllBadges();

        this.save();
    },

    // 保存故事
    saveStory(story) {
        story.id = 'story_' + Date.now();
        story.date = new Date().toISOString();
        this.data.stories = this.data.stories || [];
        this.data.stories.push(story);
        this.save();
    },

    // 重置存档
    reset() {
        this.data = createDefaultSave();
        localStorage.removeItem(STORE_KEY);
    },

    // 导出存档
    exportSave() {
        return JSON.stringify(this.data, null, 2);
    }
};

// 暴露到全局
window.Store = Store;

// ===== js/scoring.js =====
/**
 * Scoring - 积分、等级、勋章系统
 */

// 等级定义
const LEVELS = [
    { level: 1,  name: '见习探索者',   requiredScore: 0,    unlock: '基础功能' },
    { level: 2,  name: '星际学徒',     requiredScore: 100,  unlock: '解锁听力雷达站' },
    { level: 3,  name: '太空航行者',   requiredScore: 300,  unlock: '解锁作文场景全息台' },
    { level: 4,  name: '火箭驾驶员',   requiredScore: 600,  unlock: '可选第二个宇航员头像' },
    { level: 5,  name: '星际领航员',   requiredScore: 1000, unlock: '解锁数学密码方程式高级题' },

const Scoring = {
    // 获取当前等级信息
    getLevelInfo() {
        const score = Store.data.player.totalScore;
        let currentLevel = LEVELS[0];
        let nextLevel = null;

        for (let i = 0; i < LEVELS.length; i++) {
            if (score >= LEVELS[i].requiredScore) {
                currentLevel = LEVELS[i];
                nextLevel = LEVELS[i + 1] || null;
            }
        }

        const progressToNext = nextLevel
            ? Math.min(100, Math.round((score - currentLevel.requiredScore) / (nextLevel.requiredScore - currentLevel.requiredScore) * 100))
            : 100;

        return { current: currentLevel, next: nextLevel, progressToNext };
    },

    // 检查是否升级
    checkLevelUp() {
        const info = this.getLevelInfo();
        const storedLevel = Store.data.player.level;

        if (info.current.level > storedLevel) {
            Store.data.player.level = info.current.level;
            Store.save();
            // 触发升级动画
            this.showLevelUp(info.current);
            // 检查升级相关勋章
            if (info.current.level >= 9) {
                this.unlockBadge('galaxy_legend');
            }
            return true;
        }
        return false;
    },

    // 显示升级动画
    showLevelUp(levelInfo) {
        const overlay = document.getElementById('levelup-overlay');
        const title = document.getElementById('levelup-title');
        const subtitle = document.getElementById('levelup-subtitle');
        const starsContainer = document.getElementById('levelup-stars');

        title.textContent = `Lv.${levelInfo.level} ${levelInfo.name}！`;
        subtitle.textContent = levelInfo.unlock;

        // 生成星爆效果
        starsContainer.innerHTML = '';
        for (let i = 0; i < 20; i++) {
            const star = document.createElement('div');
            star.className = 'levelup-star';
            star.textContent = ['⭐', '✨', '🌟', '💫'][Math.floor(Math.random() * 4)];
            const angle = (i / 20) * Math.PI * 2;
            const dist = 100 + Math.random() * 50;
            star.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
            star.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
            star.style.animationDelay = (Math.random() * 0.3) + 's';
            starsContainer.appendChild(star);
        }

        overlay.classList.remove('hidden');

        // 播放升级音效
        Audio.playLevelUp();
    },

    // 解锁勋章
    unlockBadge(badgeId) {
        if (!Store.data.badges.includes(badgeId)) {
            Store.data.badges.push(badgeId);
            Store.save();
            this.showBadgePopup(badgeId);
            return true;
        }
        return false;
    },

    // 检查所有勋章
    checkAllBadges() {
        for (const [id, badge] of Object.entries(BADGES)) {
            if (!Store.data.badges.includes(id) && badge.condition()) {
                this.unlockBadge(id);
            }
        }
    },

    // 标记完美航行（用于勋章判定）
    markPerfectVoyage() {
        Store.data._lastPerfectVoyage = true;
    },

    // 显示勋章弹窗
    showBadgePopup(badgeId) {
        const badge = BADGES[badgeId];
        if (!badge) return;

        const overlay = document.getElementById('badge-overlay');
        document.getElementById('badge-popup-icon').textContent = badge.icon;
        document.getElementById('badge-popup-title').textContent = badge.name;
        document.getElementById('badge-popup-desc').textContent = badge.desc;

        overlay.classList.remove('hidden');

        // 撒花效果
        this.createConfetti();

        // 播放勋章音效
        Audio.playBadge();
    },

    // 撒花
    createConfetti() {
        const container = document.getElementById('confetti-container');
        container.innerHTML = '';
        const colors = ['#FF6B35', '#FFD93D', '#6BCB77', '#4FC3F7', '#BA68C8', '#FF5959'];
        const shapes = ['🎉', '🎊', '⭐', '✨', '💫'];

        for (let i = 0; i < 30; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 0.5 + 's';
            confetti.style.animationDuration = (2 + Math.random() * 2) + 's';

            if (Math.random() > 0.6) {
                confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                confetti.style.background = 'transparent';
                confetti.style.fontSize = (12 + Math.random() * 12) + 'px';
            }

            container.appendChild(confetti);
        }

        // 3秒后清理
        setTimeout(() => { container.innerHTML = ''; }, 4000);
    },

    // 计算题目积分
    calculateScore(subject, type, correctCount, totalCount) {
        const baseScores = {
            english: { vocabulary: 30, sentence: 40, listening: 35, dialogue: 40 },
            math:    { fuelCalc: 40, starRoute: 45, cipherEq: 45, baseBuild: 50 },
            writing: { storyEngine: 60, wordBridge: 55, sceneHologram: 70 }
        };

        const base = baseScores[subject]?.[type] || 30;
        const ratio = totalCount > 0 ? correctCount / totalCount : 0;
        let score = Math.round(base * (0.4 + ratio * 0.6)); // 40%保底+60%按正确率

        // 全对额外奖励
        if (ratio === 1) {
            score += 10;
            this.markPerfectVoyage();
        }

        return score;
    }
};

/**
 * Audio - 语音合成与音效管理
 */

const Audio = {
    speechSupported: 'speechSynthesis' in window,
    audioContext: null,

    // 初始化音频上下文（需用户交互后调用）
    init() {
        if (!this.audioContext) {
            try {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.log('音频不支持');
            }
        }
    },

    // 语音合成
    speak(text, lang = 'en-US') {
        if (!this.speechSupported || !Store.data.settings.soundEnabled) return;

        // 取消之前的语音
        speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.85;  // 稍慢，适合小学生
        utterance.pitch = 1.1;  // 略高音调，更友好

        // 尝试使用对应语言的语音
        const voices = speechSynthesis.getVoices();
        const voice = voices.find(v => v.lang === lang || v.lang.startsWith(lang.split('-')[0]));
        if (voice) utterance.voice = voice;

        speechSynthesis.speak(utterance);
    },

    // 中文朗读
    speakChinese(text) {
        this.speak(text, 'zh-CN');
    },

    // 音效：答对
    playCorrect() {
        if (!Store.data.settings.soundEnabled) return;
        this.playTone(523, 0.1, 'sine'); // C5
        setTimeout(() => this.playTone(659, 0.1, 'sine'), 100); // E5
        setTimeout(() => this.playTone(784, 0.15, 'sine'), 200); // G5
    },

    // 音效：答错
    playWrong() {
        if (!Store.data.settings.soundEnabled) return;
        this.playTone(200, 0.2, 'sawtooth', 0.1);
    },

    // 音效：点击
    playClick() {
        if (!Store.data.settings.soundEnabled) return;
        this.playTone(800, 0.05, 'square', 0.05);
    },

    // 音效：升级
    playLevelUp() {
        if (!Store.data.settings.soundEnabled) return;
        const notes = [523, 659, 784, 1047]; // C E G C
        notes.forEach((freq, i) => {
            setTimeout(() => this.playTone(freq, 0.2, 'sine', 0.15), i * 100);
        });
    },

    // 音效：获得勋章
    playBadge() {
        if (!Store.data.settings.soundEnabled) return;
        const notes = [659, 784, 988, 1319]; // E5 G5 B5 E6
        notes.forEach((freq, i) => {
            setTimeout(() => this.playTone(freq, 0.15, 'triangle', 0.12), i * 80);
        });
    },

    // 音效：完成任务
    playComplete() {
        if (!Store.data.settings.soundEnabled) return;
        this.playTone(523, 0.1, 'sine');
        setTimeout(() => this.playTone(659, 0.1, 'sine'), 100);
        setTimeout(() => this.playTone(784, 0.1, 'sine'), 200);
        setTimeout(() => this.playTone(1047, 0.3, 'sine'), 300);
    },

    // 播放音调
    playTone(frequency, duration, type = 'sine', volume = 0.1) {
        if (!this.audioContext) this.init();
        if (!this.audioContext) return;

        try {
            const oscillator = this.audioContext.createOscillator();
            const gainNode = this.audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(this.audioContext.destination);

            oscillator.type = type;
            oscillator.frequency.value = frequency;

            gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(volume, this.audioContext.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + duration);

            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + duration);
        } catch (e) {
            // 静默失败
        }
    },

    // 预加载语音列表（某些浏览器需要）
    loadVoices() {
        if (this.speechSupported) {
            speechSynthesis.getVoices();
        }
    }
};

// 某些浏览器需要异步加载语音
if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => Audio.loadVoices();
}

window.Audio = Audio;

/**
 * Effects - 视觉效果工具
 */

const Effects = {
    // Canvas 星空背景
    starfield: null,
    stars: [],
    ctx: null,

    // 初始化星空
    initStarfield() {
        this.starfield = document.getElementById('starfield');
        if (!this.starfield) return;

        this.ctx = this.starfield.getContext('2d');
        this.resize();

        window.addEventListener('resize', () => this.resize());

        // 生成星星
        const starCount = window.innerWidth < 768 ? 40 : 80;
        this.stars = [];
        for (let i = 0; i < starCount; i++) {
            this.stars.push({
                x: Math.random() * this.starfield.width,
                y: Math.random() * this.starfield.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.15 + 0.05,
                twinkle: Math.random() * Math.PI * 2,
                twinkleSpeed: Math.random() * 0.02 + 0.01,
                color: Math.random() > 0.8 ? '#FFD93D' : '#FFFFFF'
            });
        }

        this.animate();
    },

    resize() {
        if (!this.starfield) return;
        this.starfield.width = window.innerWidth;
        this.starfield.height = window.innerHeight;
    },

    animate() {
        if (!this.ctx || !this.starfield) return;

        this.ctx.clearRect(0, 0, this.starfield.width, this.starfield.height);

        for (const star of this.stars) {
            star.twinkle += star.twinkleSpeed;
            const opacity = 0.3 + Math.abs(Math.sin(star.twinkle)) * 0.7;

            star.y += star.speed;
            if (star.y > this.starfield.height) {
                star.y = 0;
                star.x = Math.random() * this.starfield.width;
            }

            this.ctx.beginPath();
            this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            this.ctx.fillStyle = star.color;
            this.ctx.globalAlpha = opacity;
            this.ctx.fill();

            // 大星星加光晕
            if (star.size > 1.5) {
                this.ctx.beginPath();
                this.ctx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                this.ctx.fillStyle = star.color;
                this.ctx.globalAlpha = opacity * 0.2;
                this.ctx.fill();
            }
        }

        this.ctx.globalAlpha = 1;
        requestAnimationFrame(() => this.animate());
    },

    // 答对粒子爆炸
    particleBurst(x, y, color = '#FFD93D') {
        const container = document.createElement('div');
        container.className = 'particle-burst';
        container.style.left = x + 'px';
        container.style.top = y + 'px';
        document.body.appendChild(container);

        const colors = ['#FFD93D', '#FF6B35', '#6BCB77', '#4FC3F7', '#FFFFFF'];

        for (let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];

            const angle = (i / 15) * Math.PI * 2;
            const dist = 40 + Math.random() * 40;
            particle.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
            particle.style.setProperty('--ty', Math.sin(angle) * dist + 'px');

            container.appendChild(particle);
        }

        setTimeout(() => container.remove(), 700);
    },

    // 鼓励气泡
    showEncourage(text) {
        const bubble = document.createElement('div');
        bubble.className = 'encourage-bubble';
        bubble.textContent = text;
        document.body.appendChild(bubble);
        setTimeout(() => bubble.remove(), 1500);
    },

    // 随机鼓励语
    randomEncourage() {
        const phrases = ['太棒了！', 'Great!', '你是星际天才！', '完美！', 'Excellent!', '好厉害！', '满分航行！', 'Amazing!'];
        return phrases[Math.floor(Math.random() * phrases.length)];
    },

    // 随机鼓励语（答错时）
    randomRetry() {
        const phrases = ['信号有点偏，再调一调！', '差一点点，再来！', '别灰心，继续探索！', '没关系，再试一次！', '飞船需要调整，再试试！'];
        return phrases[Math.floor(Math.random() * phrases.length)];
    },

    // 抖动元素
    shake(element) {
        element.classList.add('shake');
        setTimeout(() => element.classList.remove('shake'), 400);
    }
};

/**
 * EnglishModule - 英语星球
 * 四种题型：单词星际航行、句子修复站、听力雷达站、对话外星人
 */

const EnglishModule = {
    tasks: [
        { id: 'vocabulary', icon: '🔗', title: '单词星际航行', desc: '匹配英文和中文，帮飞船补给！', type: 'vocabulary', minLevel: 1 },
        { id: 'sentence',   icon: '🔧', title: '句子修复站',   desc: '修复乱序句子，让飞船通讯恢复！', type: 'sentence', minLevel: 1 },
        { id: 'listening',  icon: '📡', title: '听力雷达站',   desc: '听声音选答案，扫描太空信号！', type: 'listening', minLevel: 2 },
        { id: 'dialogue',   icon: '👽', title: '对话外星人',   desc: '和外星人用英语交流，建立友谊！', type: 'dialogue', minLevel: 1 }
    ],

    currentTask: null,
    currentQuestions: [],
    currentIndex: 0,
    correctCount: 0,
    answeredWrong: [],

    renderSubjectPage(container) {
        const progress = Store.data.progress.english;
        const levelInfo = Scoring.getLevelInfo();

        let tasksHtml = '';
        for (const task of this.tasks) {
            const locked = levelInfo.current.level < task.minLevel;
            const completed = progress[task.id].completed;
            tasksHtml += `
                <div class="task-card ${locked ? 'locked' : ''}" ${locked ? '' : `onclick="EnglishModule.startTask('${task.id}')"`}>
                    <div class="task-card-icon">${task.icon}</div>
                    <div class="task-card-title">${task.title}</div>
                    <div class="task-card-desc">${task.desc}</div>
                    ${completed > 0 ? `<div class="task-card-badge">已完成 ${completed} 次</div>` : ''}
                    ${locked ? `<div class="task-card-lock">🔒</div>` : ''}
                </div>
            `;
        }

        container.innerHTML = `
            <div class="subject-page">
                <div class="subject-header">
                    <h1 class="subject-title english">📚 英语星球</h1>
                    <p class="subject-desc">在星际任务中学习英语，每个任务都是一次冒险！</p>
                </div>
                <div class="task-grid">${tasksHtml}</div>
            </div>
        `;
    },

    // 开始任务
    startTask(taskId) {
        Audio.playClick();
        const task = this.tasks.find(t => t.id === taskId);
        this.currentTask = task;

        // 从题库随机选取6-8题
        const allQuestions = EnglishQuestions[taskId] || [];
        const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
        this.currentQuestions = shuffled.slice(0, Math.min(6, shuffled.length));
        this.currentIndex = 0;
        this.correctCount = 0;
        this.answeredWrong = [];

        this.renderQuestion();
    },

    // 渲染题目
    renderQuestion() {
        const app = document.getElementById('app');
        const q = this.currentQuestions[this.currentIndex];

        // 进度点
        let dotsHtml = '';
        for (let i = 0; i < this.currentQuestions.length; i++) {
            let cls = 'progress-dot';
            if (i < this.currentIndex) cls += this.answeredWrong.includes(i) ? ' wrong' : ' done';
            if (i === this.currentIndex) cls += ' current';
            dotsHtml += `<div class="${cls}"></div>`;
        }

        const header = `
            <div class="quiz-progress">
                <span>任务进度</span>
                <div class="progress-dots">${dotsHtml}</div>
                <span>${this.currentIndex + 1}/${this.currentQuestions.length}</span>
            </div>
        `;

        let questionHtml = '';
        switch (this.currentTask.type) {
            case 'vocabulary':
                questionHtml = this.renderVocabulary(q);
                break;
            case 'sentence':
                questionHtml = this.renderSentence(q);
                break;
            case 'listening':
                questionHtml = this.renderListening(q);
                break;
            case 'dialogue':
                questionHtml = this.renderDialogue(q);
                break;
        }

        app.innerHTML = header + questionHtml;
    },

    // 题型一：单词星际航行（连线匹配）
    renderVocabulary(q) {
        const shuffled = [...q.pairs].sort(() => Math.random() - 0.5);
        const shuffledZh = [...q.pairs].map(p => p.zh).sort(() => Math.random() - 0.5);

        let leftHtml = shuffled.map((p, i) =>
            `<div class="match-item" data-en="${p.en}" data-index="${i}" onclick="EnglishModule.selectMatch('left', ${i}, '${p.en}')">${p.en}</div>`
        ).join('');

        let rightHtml = shuffledZh.map((zh, i) => {
            const pair = q.pairs.find(p => p.zh === zh);
            return `<div class="match-item" data-zh="${zh}" data-index="${i}" data-en="${pair.en}" onclick="EnglishModule.selectMatch('right', ${i}, '${pair.en}')">${zh}</div>`;
        }).join('');

        return `
            <div class="question-area">
                <div class="question-story">📡 ${q.story}</div>
                <div class="question-text">主题：${q.theme} — 点击左右配对！</div>
                <div class="match-container">
                    <div class="match-column" id="match-left">${leftHtml}</div>
                    <div class="match-column" id="match-right">${rightHtml}</div>
                </div>
                <div id="match-feedback"></div>
            </div>
            <div id="match-complete" class="hidden">
                <div class="result-container">
                    <div class="result-icon">🎉</div>
                    <h2 class="result-title">任务完成！</h2>
                    <div id="match-result-content"></div>
                </div>
            </div>
        `;
    },

    selectedLeft: null,
    selectedRight: null,
    matchedPairs: 0,

    selectMatch(side, index, value) {
        Audio.playClick();
        const items = document.querySelectorAll(`#match-${side} .match-item`);

        if (side === 'left') {
            document.querySelectorAll('#match-left .match-item').forEach(el => el.classList.remove('selected'));
            items[index].classList.add('selected');
            this.selectedLeft = { index, value, el: items[index] };
        } else {
            document.querySelectorAll('#match-right .match-item').forEach(el => el.classList.remove('selected'));
            items[index].classList.add('selected');
            this.selectedRight = { index, value, el: items[index] };
        }

        // 两边都选了，检查匹配
        if (this.selectedLeft && this.selectedRight) {
            const isCorrect = this.selectedLeft.value === this.selectedRight.value;
            const leftEl = this.selectedLeft.el;
            const rightEl = this.selectedRight.el;

            if (isCorrect) {
                leftEl.classList.add('matched');
                rightEl.classList.add('matched');
                leftEl.classList.remove('selected');
                rightEl.classList.remove('selected');
                this.matchedPairs++;
                this.correctCount++;

                Audio.playCorrect();
                Effects.showEncourage(Effects.randomEncourage());

                // 检查是否全部匹配
                const totalPairs = this.currentQuestions[this.currentIndex].pairs.length;
                if (this.matchedPairs >= totalPairs) {
                    this.finishVocabularyQuestion();
                }
            } else {
                leftEl.classList.add('wrong-flash');
                rightEl.classList.add('wrong-flash');
                Audio.playWrong();
                Effects.showEncourage(Effects.randomRetry());

                setTimeout(() => {
                    leftEl.classList.remove('wrong-flash', 'selected');
                    rightEl.classList.remove('wrong-flash', 'selected');
                }, 600);
            }

            this.selectedLeft = null;
            this.selectedRight = null;
        }
    },

    finishVocabularyQuestion() {
        this.matchedPairs = 0;
        this.nextQuestion();
    },

    // 题型二：句子修复站
    renderSentence(q) {
        if (q.type === 'sort') {
            const shuffled = [...q.words].sort(() => Math.random() - 0.5);
            let wordsHtml = shuffled.map((w, i) =>
                `<span class="word-card" onclick="EnglishModule.placeWord(${i}, '${w.replace(/'/g, "\\'")}')">${w}</span>`
            ).join('');

            return `
                <div class="question-area">
                    <div class="question-story">🔧 ${q.story}</div>
                    <div class="question-text">把单词排成正确的句子：<br><small style="color:var(--color-text-secondary);">${q.translation}</small></div>
                    <div class="sentence-slots" id="sentence-slots"></div>
                    <div style="margin-top:10px;">${wordsHtml}</div>
                    <div id="sentence-feedback"></div>
                </div>
            `;
        } else {
            let optionsHtml = q.options.map((opt, i) =>
                `<button class="option-btn" onclick="EnglishModule.answerFill('${opt.replace(/'/g, "\\'")}', '${q.answer.replace(/'/g, "\\'")}')">
                    <span class="option-letter">${'ABC'[i]}</span>${opt}
                </button>`
            ).join('');

            return `
                <div class="question-area">
                    <div class="question-story">🔧 ${q.story}</div>
                    <div class="question-text">${q.sentence}</div>
                    <div class="options">${optionsHtml}</div>
                    <div id="fill-feedback"></div>
                </div>
            `;
        }
    },

    placedWords: [],

    placeWord(index, word) {
        Audio.playClick();
        const slots = document.getElementById('sentence-slots');
        const cards = document.querySelectorAll('.word-card');

        // 如果已经放置，跳过
        if (this.placedWords.includes(index)) return;

        this.placedWords.push(index);
        cards[index].classList.add('placed');

        const slot = document.createElement('span');
        slot.className = 'word-card placed';
        slot.textContent = word;
        slot.dataset.wordIndex = index;
        slot.onclick = () => this.removeWord(index, word, slot);
        slots.appendChild(slot);

        // 检查是否全部放置
        const q = this.currentQuestions[this.currentIndex];
        if (this.placedWords.length >= q.words.length) {
            // 检查顺序
            const placed = Array.from(slots.children).map(el => el.textContent);
            const isCorrect = JSON.stringify(placed) === JSON.stringify(q.answer);

            const feedback = document.getElementById('sentence-feedback');
            if (isCorrect) {
                feedback.innerHTML = `<div class="feedback success">✅ ${q.translation} ${Effects.randomEncourage()}</div>`;
                this.correctCount++;
                Audio.playCorrect();
                Effects.showEncourage(Effects.randomEncourage());
                setTimeout(() => this.nextQuestion(), 1500);
            } else {
                feedback.innerHTML = `<div class="feedback error">顺序不对，再试试！正确顺序：${q.answer.join(' ')}</div>`;
                this.answeredWrong.push(this.currentIndex);
                Audio.playWrong();
                setTimeout(() => this.nextQuestion(), 2000);
            }
        }
    },

    removeWord(index, word, slotEl) {
        Audio.playClick();
        this.placedWords = this.placedWords.filter(i => i !== index);
        slotEl.remove();
        const cards = document.querySelectorAll('.word-card');
        cards[index]?.classList.remove('placed');
    },

    answerFill(selected, answer) {
        const buttons = document.querySelectorAll('.option-btn');
        const isCorrect = selected === answer;
        const q = this.currentQuestions[this.currentIndex];

        buttons.forEach(btn => {
            const text = btn.textContent.trim().slice(1).trim();
            if (text === answer) {
                btn.classList.add('correct');
            } else if (text === selected) {
                btn.classList.add(isCorrect ? 'correct' : 'wrong');
            }
            btn.style.pointerEvents = 'none';
        });

        const feedback = document.getElementById('fill-feedback');
        if (isCorrect) {
            feedback.innerHTML = `<div class="feedback success">✅ ${q.translation} ${Effects.randomEncourage()}</div>`;
            this.correctCount++;
            Audio.playCorrect();
            Effects.showEncourage(Effects.randomEncourage());
        } else {
            feedback.innerHTML = `<div class="feedback error">正确答案是：${answer}<br>${q.translation}</div>`;
            this.answeredWrong.push(this.currentIndex);
            Audio.playWrong();
        }

        setTimeout(() => this.nextQuestion(), 2000);
    },

    // 题型三：听力雷达站
    renderListening(q) {
        let optionsHtml = q.options.map((opt, i) =>
            `<button class="option-btn" onclick="EnglishModule.answerListening(${i}, ${q.answer})">
                <span class="option-letter">${'ABC'[i]}</span>${opt}
            </button>`
        ).join('');

        return `
            <div class="question-area">
                <div class="question-story">📡 ${q.story}</div>
                <div style="text-align:center;margin:20px 0;">
                    <button class="btn btn-primary btn-large" onclick="EnglishModule.playAudio('${q.audio.replace(/'/g, "\\'")}')">
                        🔊 播放声音
                    </button>
                </div>
                <div class="options">${optionsHtml}</div>
                <div id="listening-feedback"></div>
            </div>
        `;
    },

    playAudio(text) {
        Audio.playClick();
        Audio.speak(text);
    },

    answerListening(selected, answer) {
        const isCorrect = selected === answer;
        const buttons = document.querySelectorAll('.option-btn');

        buttons.forEach((btn, i) => {
            if (i === answer) {
                btn.classList.add('correct');
            } else if (i === selected && !isCorrect) {
                btn.classList.add('wrong');
            }
            btn.style.pointerEvents = 'none';
        });

        const feedback = document.getElementById('listening-feedback');
        const q = this.currentQuestions[this.currentIndex];
        if (isCorrect) {
            feedback.innerHTML = `<div class="feedback success">✅ ${Effects.randomEncourage()}</div>`;
            this.correctCount++;
            Audio.playCorrect();
            Effects.showEncourage(Effects.randomEncourage());
        } else {
            feedback.innerHTML = `<div class="feedback error">正确答案：${q.options[answer]}</div>`;
            this.answeredWrong.push(this.currentIndex);
            Audio.playWrong();
        }

        setTimeout(() => this.nextQuestion(), 2000);
    },

    // 题型四：对话外星人
    renderDialogue(q) {
        let optionsHtml = q.options.map((opt, i) =>
            `<button class="option-btn" onclick="EnglishModule.answerDialogue(${i})">
                <span class="option-letter">${'ABC'[i]}</span>
                <div><div>${opt.text}</div><small style="color:var(--color-text-secondary);">${opt.trans}</small></div>
            </button>`
        ).join('');

        return `
            <div class="question-area">
                <div class="question-story">👽 ${q.story}</div>
                <div class="card" style="background:rgba(255,217,61,0.1);border-color:rgba(255,217,61,0.3);margin-bottom:16px;">
                    <div style="font-size:1.2rem;margin-bottom:6px;">👽 "${q.alien}"</div>
                    <div style="color:var(--color-text-secondary);font-size:0.9rem;">${q.alienTranslation}</div>
                </div>
                <div style="color:var(--color-text-secondary);margin-bottom:12px;">选择最合适的回应：</div>
                <div class="options">${optionsHtml}</div>
                <div id="dialogue-feedback"></div>
            </div>
        `;
    },

    answerDialogue(selected) {
        const q = this.currentQuestions[this.currentIndex];
        const isCorrect = q.options[selected].correct;
        const buttons = document.querySelectorAll('.option-btn');

        buttons.forEach((btn, i) => {
            if (q.options[i].correct) {
                btn.classList.add('correct');
            } else if (i === selected) {
                btn.classList.add('wrong');
            }
            btn.style.pointerEvents = 'none';
        });

        const feedback = document.getElementById('dialogue-feedback');
        if (isCorrect) {
            feedback.innerHTML = `<div class="feedback success">✅ 太棒了！和外星人建立了友谊！</div>`;
            this.correctCount++;
            Audio.playCorrect();
            Effects.showEncourage(Effects.randomEncourage());

            // 如果是情景对话，播放正确回应的语音
            Audio.speak(q.options[selected].text);
        } else {
            const correctOpt = q.options.find(o => o.correct);
            feedback.innerHTML = `<div class="feedback error">更合适的回应是：${correctOpt.text}<br>${correctOpt.trans}</div>`;
            this.answeredWrong.push(this.currentIndex);
            Audio.playWrong();
        }

        setTimeout(() => this.nextQuestion(), 2500);
    },

    // 下一题
    nextQuestion() {
        this.currentIndex++;
        this.placedWords = [];

        if (this.currentIndex < this.currentQuestions.length) {
            this.renderQuestion();
        } else {
            this.finishTask();
        }
    },

    // 完成任务
    finishTask() {
        const total = this.currentQuestions.length;
        const correct = this.correctCount;
        const score = Scoring.calculateScore('english', this.currentTask.id, correct, total);

        Store.recordCompletion('english', this.currentTask.id, correct, total);
        const result = Store.addScore(score);
        Scoring.checkAllBadges();

        const ratio = Math.round(correct / total * 100);
        let icon = ratio >= 80 ? '🌟' : ratio >= 60 ? '👍' : '💪';
        let title = ratio >= 80 ? '完美航行！' : ratio >= 60 ? '任务完成！' : '继续加油！';

        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="result-container">
                <div class="result-icon">${icon}</div>
                <h2 class="result-title">${title}</h2>
                <div class="result-score">+${score}</div>
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-value">${correct}/${total}</div>
                        <div class="result-stat-label">正确题数</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value">${ratio}%</div>
                        <div class="result-stat-label">正确率</div>
                    </div>
                </div>
                <div class="result-actions">
                    <button class="btn btn-secondary" onclick="App.navigate('english')">返回英语星球</button>
                    <button class="btn btn-primary" onclick="EnglishModule.startTask('${this.currentTask.id}')">再来一次</button>
                </div>
            </div>
        `;

        Audio.playComplete();
        App.updateStatusbar();
    }
};

window.EnglishModule = EnglishModule;

/**
 * MathModule - 数学星球
 * 四种题型：燃料计算器、星际航线、密码方程式、基地建造师
 */

const MathModule = {
    tasks: [
        { id: 'fuelCalc', icon: '⛽', title: '燃料计算器', desc: '计算燃料数量，让飞船起飞！', type: 'fuelCalc', minLevel: 1 },
        { id: 'starRoute', icon: '🛰️', title: '星际航线', desc: '用分数规划太空航线！', type: 'starRoute', minLevel: 1 },
        { id: 'cipherEq', icon: '🔐', title: '密码方程式', desc: '解方程破解密码锁！', type: 'cipherEq', minLevel: 1 },
        { id: 'baseBuild', icon: '🏗️', title: '基地建造师', desc: '计算面积建造太空基地！', type: 'baseBuild', minLevel: 1 }
    ],

    currentTask: null,
    currentQuestions: [],
    currentIndex: 0,
    correctCount: 0,
    answeredWrong: [],

    renderSubjectPage(container) {
        const progress = Store.data.progress.math;
        const levelInfo = Scoring.getLevelInfo();

        let tasksHtml = '';
        for (const task of this.tasks) {
            const locked = levelInfo.current.level < task.minLevel;
            const completed = progress[task.id].completed;
            tasksHtml += `
                <div class="task-card ${locked ? 'locked' : ''}" ${locked ? '' : `onclick="MathModule.startTask('${task.id}')"`}>
                    <div class="task-card-icon">${task.icon}</div>
                    <div class="task-card-title">${task.title}</div>
                    <div class="task-card-desc">${task.desc}</div>
                    ${completed > 0 ? `<div class="task-card-badge">已完成 ${completed} 次</div>` : ''}
                    ${locked ? `<div class="task-card-lock">🔒</div>` : ''}
                </div>
            `;
        }

        container.innerHTML = `
            <div class="subject-page">
                <div class="subject-header">
                    <h1 class="subject-title math">🔢 数学星球</h1>
                    <p class="subject-desc">用数学解决太空问题，每个数字都是一次冒险！</p>
                </div>
                <div class="task-grid">${tasksHtml}</div>
            </div>
        `;
    },

    startTask(taskId) {
        Audio.playClick();
        this.currentTask = this.tasks.find(t => t.id === taskId);
        const allQuestions = MathQuestions[taskId] || [];
        const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
        this.currentQuestions = shuffled.slice(0, Math.min(6, shuffled.length));
        this.currentIndex = 0;
        this.correctCount = 0;
        this.answeredWrong = [];
        this.renderQuestion();
    },

    renderQuestion() {
        const app = document.getElementById('app');
        const q = this.currentQuestions[this.currentIndex];

        let dotsHtml = '';
        for (let i = 0; i < this.currentQuestions.length; i++) {
            let cls = 'progress-dot';
            if (i < this.currentIndex) cls += this.answeredWrong.includes(i) ? ' wrong' : ' done';
            if (i === this.currentIndex) cls += ' current';
            dotsHtml += `<div class="${cls}"></div>`;
        }

        const header = `
            <div class="quiz-progress">
                <span>任务进度</span>
                <div class="progress-dots">${dotsHtml}</div>
                <span>${this.currentIndex + 1}/${this.currentQuestions.length}</span>
            </div>
        `;

        let questionHtml = '';
        switch (this.currentTask.type) {
            case 'fuelCalc':
                questionHtml = this.renderFuelCalc(q);
                break;
            case 'starRoute':
                questionHtml = this.renderStarRoute(q);
                break;
            case 'cipherEq':
                questionHtml = this.renderCipherEq(q);
                break;
            case 'baseBuild':
                questionHtml = this.renderBaseBuild(q);
                break;
        }

        app.innerHTML = header + questionHtml;
    },

    // 题型一：燃料计算器
    renderFuelCalc(q) {
        return `
            <div class="question-area">
                <div class="question-story">⛽ ${q.story}</div>
                <div class="question-text">${q.question}</div>
                <div style="text-align:center;margin:20px 0;">
                    <div style="font-family:var(--font-number);font-size:1.5rem;color:var(--color-star-yellow);">${q.expression}</div>
                    <div class="fuel-gauge" style="max-width:300px;margin:16px auto;">
                        <div class="fuel-bar" id="fuel-bar" style="width:0%"></div>
                    </div>
                </div>
                <div style="text-align:center;">
                    <input type="number" class="fill-input" id="fuel-answer" placeholder="输入答案" step="0.1" onkeydown="if(event.key==='Enter')MathModule.checkFuelCalc(${q.answer}, '${q.unit}')">
                    <span style="margin-left:8px;color:var(--color-text-secondary);">${q.unit}</span>
                </div>
                <div id="fuel-feedback"></div>
                <div style="text-align:center;margin-top:16px;">
                    <button class="btn btn-primary" onclick="MathModule.checkFuelCalc(${q.answer}, '${q.unit}')">确认 🚀</button>
                </div>
            </div>
        `;
    },

    checkFuelCalc(answer, unit) {
        const input = document.getElementById('fuel-answer');
        const userAnswer = parseFloat(input.value);
        const feedback = document.getElementById('fuel-feedback');

        if (isNaN(userAnswer)) {
            feedback.innerHTML = `<div class="feedback error">请输入数字哦！</div>`;
            return;
        }

        input.disabled = true;
        const isCorrect = Math.abs(userAnswer - answer) < 0.01;

        if (isCorrect) {
            input.classList.add('correct');
            feedback.innerHTML = `<div class="feedback success">✅ 燃料加满！飞船可以起飞了！</div>`;
            this.correctCount++;
            Audio.playCorrect();
            Effects.showEncourage(Effects.randomEncourage());

            // 燃料表动画
            document.getElementById('fuel-bar').style.width = '100%';
        } else {
            input.classList.add('wrong');
            feedback.innerHTML = `<div class="feedback error">正确答案：${answer} ${unit}</div>`;
            this.answeredWrong.push(this.currentIndex);
            Audio.playWrong();
        }

        setTimeout(() => this.nextQuestion(), 2000);
    },

    // 题型二：星际航线（选择题）
    renderStarRoute(q) {
        let optionsHtml = q.options.map((opt, i) =>
            `<button class="option-btn" onclick="MathModule.answerStarRoute(${i}, ${q.correctIndex})">
                <span class="option-letter">${'ABC'[i]}</span>${opt}
            </button>`
        ).join('');

        return `
            <div class="question-area">
                <div class="question-story">🛰️ ${q.story}</div>
                <div class="question-text">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div id="star-feedback"></div>
            </div>
        `;
    },

    answerStarRoute(selected, correctIndex) {
        const isCorrect = selected === correctIndex;
        const buttons = document.querySelectorAll('.option-btn');
        const q = this.currentQuestions[this.currentIndex];

        buttons.forEach((btn, i) => {
            if (i === correctIndex) {
                btn.classList.add('correct');
            } else if (i === selected) {
                btn.classList.add('wrong');
            }
            btn.style.pointerEvents = 'none';
        });

        const feedback = document.getElementById('star-feedback');
        if (isCorrect) {
            feedback.innerHTML = `<div class="feedback success">✅ 航线连通！${q.answerDesc}</div>`;
            this.correctCount++;
            Audio.playCorrect();
            Effects.showEncourage(Effects.randomEncourage());
        } else {
            feedback.innerHTML = `<div class="feedback error">正确答案：${q.answer}<br>${q.answerDesc}</div>`;
            this.answeredWrong.push(this.currentIndex);
            Audio.playWrong();
        }

        setTimeout(() => this.nextQuestion(), 2200);
    },

    // 题型三：密码方程式
    renderCipherEq(q) {
        return `
            <div class="question-area">
                <div class="question-story">🔐 ${q.story}</div>
                <div class="question-text">${q.question}</div>
                <div class="cipher-lock" id="cipher-lock">🔒</div>
                <div style="text-align:center;margin:20px 0;">
                    <div style="font-family:var(--font-number);font-size:2rem;color:var(--color-star-yellow);background:rgba(255,217,61,0.1);padding:16px;border-radius:12px;border:2px solid rgba(255,217,61,0.3);">
                        ${q.equation}
                    </div>
                </div>
                <div style="text-align:center;">
                    <span style="color:var(--color-text-secondary);">x = </span>
                    <input type="number" class="fill-input" id="cipher-answer" placeholder="?" step="0.1" onkeydown="if(event.key==='Enter')MathModule.checkCipherEq(${q.answer})">
                </div>
                <div id="cipher-feedback"></div>
                <div style="text-align:center;margin-top:16px;">
                    <button class="btn btn-primary" onclick="MathModule.checkCipherEq(${q.answer})">解锁 🔓</button>
                </div>
            </div>
        `;
    },

    checkCipherEq(answer) {
        const input = document.getElementById('cipher-answer');
        const userAnswer = parseFloat(input.value);
        const feedback = document.getElementById('cipher-feedback');
        const lock = document.getElementById('cipher-lock');

        if (isNaN(userAnswer)) {
            feedback.innerHTML = `<div class="feedback error">请输入数字！</div>`;
            return;
        }

        input.disabled = true;
        const isCorrect = Math.abs(userAnswer - answer) < 0.01;

        if (isCorrect) {
            input.classList.add('correct');
            lock.textContent = '🔓';
            lock.classList.add('unlocked');
            feedback.innerHTML = `<div class="feedback success">✅ 密码正确！基地大门打开了！</div>`;
            this.correctCount++;
            Audio.playCorrect();
            Effects.showEncourage(Effects.randomEncourage());
        } else {
            input.classList.add('wrong');
            feedback.innerHTML = `<div class="feedback error">密码不对，正确答案是：x = ${answer}</div>`;
            this.answeredWrong.push(this.currentIndex);
            Audio.playWrong();
        }

        setTimeout(() => this.nextQuestion(), 2200);
    },

    // 题型四：基地建造师
    renderBaseBuild(q) {
        const shapes = {
            '长方形': '▭', '正方形': '◻', '平行四边形': '▱',
            '三角形': '△', '梯形': '⏢'
        };
        const shapeIcon = shapes[q.shape] || '⬜';

        return `
            <div class="question-area">
                <div class="question-story">🏗️ ${q.story}</div>
                <div class="question-text">${q.question}</div>
                <div style="text-align:center;margin:16px 0;">
                    <div style="font-size:4rem;">${shapeIcon}</div>
                    <div style="color:var(--color-text-secondary);margin-top:8px;">形状：${q.shape} | ${q.params}</div>
                    <div style="font-family:var(--font-number);font-size:1.3rem;color:var(--color-star-yellow);margin-top:12px;">${q.expression}</div>
                </div>
                <div style="text-align:center;">
                    <input type="number" class="fill-input" id="build-answer" placeholder="面积" step="0.1" onkeydown="if(event.key==='Enter')MathModule.checkBaseBuild(${q.answer}, '${q.unit}')">
                    <span style="margin-left:8px;color:var(--color-text-secondary);">${q.unit}</span>
                </div>
                <div id="build-feedback"></div>
                <div style="text-align:center;margin-top:16px;">
                    <button class="btn btn-primary" onclick="MathModule.checkBaseBuild(${q.answer}, '${q.unit}')">建造 🏗️</button>
                </div>
            </div>
        `;
    },

    checkBaseBuild(answer, unit) {
        const input = document.getElementById('build-answer');
        const userAnswer = parseFloat(input.value);
        const feedback = document.getElementById('build-feedback');

        if (isNaN(userAnswer)) {
            feedback.innerHTML = `<div class="feedback error">请输入数字！</div>`;
            return;
        }

        input.disabled = true;
        const isCorrect = Math.abs(userAnswer - answer) < 0.5;

        if (isCorrect) {
            input.classList.add('correct');
            feedback.innerHTML = `<div class="feedback success">✅ 建造完成！基地又多了一座建筑！</div>`;
            this.correctCount++;
            Audio.playCorrect();
            Effects.showEncourage(Effects.randomEncourage());
        } else {
            input.classList.add('wrong');
            feedback.innerHTML = `<div class="feedback error">建造失败，正确面积是：${answer} ${unit}</div>`;
            this.answeredWrong.push(this.currentIndex);
            Audio.playWrong();
        }

        setTimeout(() => this.nextQuestion(), 2200);
    },

    nextQuestion() {
        this.currentIndex++;
        if (this.currentIndex < this.currentQuestions.length) {
            this.renderQuestion();
        } else {
            this.finishTask();
        }
    },

    finishTask() {
        const total = this.currentQuestions.length;
        const correct = this.correctCount;
        const score = Scoring.calculateScore('math', this.currentTask.id, correct, total);

        Store.recordCompletion('math', this.currentTask.id, correct, total);
        Store.addScore(score);
        Scoring.checkAllBadges();

        const ratio = Math.round(correct / total * 100);
        let icon = ratio >= 80 ? '🌟' : ratio >= 60 ? '👍' : '💪';
        let title = ratio >= 80 ? '完美航行！' : ratio >= 60 ? '任务完成！' : '继续加油！';

        document.getElementById('app').innerHTML = `
            <div class="result-container">
                <div class="result-icon">${icon}</div>
                <h2 class="result-title">${title}</h2>
                <div class="result-score">+${score}</div>
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-value">${correct}/${total}</div>
                        <div class="result-stat-label">正确题数</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value">${ratio}%</div>
                        <div class="result-stat-label">正确率</div>
                    </div>
                </div>
                <div class="result-actions">
                    <button class="btn btn-secondary" onclick="App.navigate('math')">返回数学星球</button>
                    <button class="btn btn-primary" onclick="MathModule.startTask('${this.currentTask.id}')">再来一次</button>
                </div>
            </div>
        `;

        Audio.playComplete();
        App.updateStatusbar();
    }
};

window.MathModule = MathModule;
